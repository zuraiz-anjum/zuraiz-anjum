name: upstream PRs
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/upstream.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "Zuraiz Anjum"
          git config user.email "zuraizwork@gmail.com"
          git commit -am "Refresh the upstream PR list"
          git push
